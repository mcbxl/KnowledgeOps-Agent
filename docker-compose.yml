services:
  mysql:
    image: mysql:8.4
    container_name: knowledgeops-mysql
    environment:
      MYSQL_DATABASE: knowledgeops
      MYSQL_USER: knowledgeops
      MYSQL_PASSWORD: knowledgeops
      MYSQL_ROOT_PASSWORD: knowledgeops-root
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - knowledgeops-mysql-data:/var/lib/mysql

volumes:
  knowledgeops-mysql-data:
