services:
  mysql:
    image: mysql:8.4
    container_name: knowledgeops-mysql
    environment:
      MYSQL_DATABASE: knowledgeops
      MYSQL_USER: knowledgeops
      MYSQL_PASSWORD: knowledgeops
      MYSQL_ROOT_PASSWORD: knowledgeops-root
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - knowledgeops-mysql-data:/var/lib/mysql

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: knowledgeops-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - knowledgeops-qdrant-data:/qdrant/storage

volumes:
  knowledgeops-mysql-data:
  knowledgeops-qdrant-data:
